<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">TNT Classic Movie Channel</title>
  <desc id="desc">A dramatic red and black TNT movie-channel preview with a classic cinema marquee.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset=".48" stop-color="#21070c"/><stop offset="1" stop-color="#090909"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#e31937" stop-opacity=".56"/><stop offset="1" stop-color="#e31937" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="860" cy="190" r="280" fill="url(#glow)" filter="url(#blur)"/>
  <path d="M0 520L1200 405V630H0Z" fill="#020202" opacity=".74"/>
  <g opacity=".28" fill="none" stroke="#ffffff">
    <path d="M90 110h420v250H90z"/><path d="M120 140h360v190H120z"/><path d="M160 375h280"/><path d="M210 395h180"/>
  </g>
  <g transform="translate(690 115)">
    <rect width="390" height="250" rx="28" fill="#0b0b0b" stroke="#e31937" stroke-width="8"/>
    <rect x="35" y="35" width="320" height="145" rx="14" fill="#1b1012" stroke="#f6c56b" stroke-width="3"/>
    <path d="M110 213h170" stroke="#f6c56b" stroke-width="8" stroke-linecap="round"/>
    <path d="M195 180v33" stroke="#f6c56b" stroke-width="8"/>
    <circle cx="319" cy="211" r="10" fill="#e31937"/>
  </g>
  <text x="90" y="165" fill="#e31937" font-family="Arial Black,Arial,sans-serif" font-size="42" letter-spacing="7">TURNER VAULT</text>
  <text x="84" y="300" fill="#ffffff" font-family="Arial Black,Arial,sans-serif" font-size="155" letter-spacing="-8">TNT</text>
  <text x="94" y="365" fill="#f6c56b" font-family="Georgia,serif" font-size="42">Classic Movie Channel</text>
  <text x="94" y="430" fill="#cfc8c4" font-family="Arial,sans-serif" font-size="26">Movies all day · A new lineup every local midnight</text>
  <g transform="translate(92 477)">
